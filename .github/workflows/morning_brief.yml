name: Morning Brief

on:
  schedule:
    - cron: '0 13 * * *'  # 6 AM PDT (UTC-7, Mar–Nov). Change to 14:00 for PST season.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  send-brief:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install youtube-transcript-api

      - name: Run morning brief
        env:
          GEMINI_API_KEY:   ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GMAIL_ADDRESS:    ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASS:   ${{ secrets.GMAIL_APP_PASS }}
          TO_EMAIL:         ${{ secrets.TO_EMAIL }}
        run: python morning_brief_v2.py

      - name: Commit pick history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_picks.json
          git diff --staged --quiet || git commit -m "chore: update deep dive pick history [skip ci]"
          git push
